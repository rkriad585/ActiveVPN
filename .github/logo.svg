<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <linearGradient id="shield_gradient" x1="100" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>

        <linearGradient id="active_gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="100%" stop-color="#22c55e" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg_gradient)" />

    <g stroke="#334155" stroke-opacity="0.25" stroke-width="2">
        <path d="M64 148H448" />
        <path d="M64 256H448" />
        <path d="M128 64V332" />
        <path d="M256 64V332" />
        <path d="M384 64V332" />
    </g>

    <g transform="translate(76.8 21.5) scale(0.7)">
        <g filter="url(#glow)">
            <path d="M256 60C150 60 110 130 110 130V240C110 330 256 450 256 450C256 450 402 330 402 240V130C402 130 362 60 256 60Z"
                  stroke="url(#shield_gradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </g>
        <path d="M190 250L240 300L330 190" stroke="#4ade80" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    </g>

    <g>
        <circle cx="360" cy="98" r="15" fill="#4ade80" opacity="0.5">
            <animate attributeName="r" from="15" to="35" dur="1.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" from="0.6" to="0" dur="1.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="360" cy="98" r="12" fill="#22c55e" stroke="#0f172a" stroke-width="2" />
    </g>

    <text x="256" y="418" font-family="'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="10" fill="#f1f5f9" text-anchor="middle">ACTIVE</text>
    <text x="256" y="486" font-family="'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="14" fill="url(#active_gradient)" text-anchor="middle">VPN</text>
</svg>
