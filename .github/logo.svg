<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions for Gradients and Filters -->
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bg_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0f172a" /> <!-- Dark Slate -->
            <stop offset="100%" stop-color="#1e293b" /> <!-- Lighter Slate -->
        </linearGradient>

        <!-- Icon Gradient (Cyber Blue to Purple) -->
        <linearGradient id="shield_gradient" x1="100" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" /> <!-- Cyan -->
            <stop offset="100%" stop-color="#818cf8" /> <!-- Indigo -->
        </linearGradient>

        <!-- Active Green Gradient -->
        <linearGradient id="active_gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="100%" stop-color="#22c55e" />
        </linearGradient>

        <!-- Glow Effect -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background Shape (Rounded Squircle) -->
    <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg_gradient)" />

    <!-- Subtle Background Grid (Tech feel) -->
    <path d="M50 128H462" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />
    <path d="M50 256H462" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />
    <path d="M50 384H462" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />
    <path d="M128 50V462" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />
    <path d="M256 50V462" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />
    <path d="M384 50V462" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />

    <!-- The Shield Icon -->
    <g filter="url(#glow)">
        <path d="M256 60C150 60 110 130 110 130V240C110 330 256 450 256 450C256 450 402 330 402 240V130C402 130 362 60 256 60Z" 
              stroke="url(#shield_gradient)" 
              stroke-width="24" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              fill="none"/>
    </g>

    <!-- The "Checkmark/V" inside (Success/Active) -->
    <path d="M190 250L240 300L330 190" 
          stroke="#4ade80" 
          stroke-width="30" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)" />

    <!-- The "Active" Status Pulse Dot -->
    <g>
        <!-- Pulse Animation Ring -->
        <circle cx="400" cy="110" r="15" fill="#4ade80" opacity="0.5">
            <animate attributeName="r" from="15" to="35" dur="1.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" from="0.6" to="0" dur="1.5s" repeatCount="indefinite" />
        </circle>
        
        <!-- Solid Dot -->
        <circle cx="400" cy="110" r="12" fill="#22c55e" stroke="#0f172a" stroke-width="2" />
    </g>

    <!-- Text Label (Optional, remove group if you want icon only) -->
    <!-- 
    <text x="256" y="480" font-family="Arial, sans-serif" font-size="40" fill="#94a3b8" text-anchor="middle" font-weight="bold" letter-spacing="4">VPNACTIVE</text> 
    -->
</svg>
