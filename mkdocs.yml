site_name: ActiveVPN
site_description: The Ultimate Network Privacy & VPN Detection Tool
site_url: https://rkriad585.github.io/ActiveVPN/
repo_url: https://github.com/rkriad585/ActiveVPN
repo_name: rkriad585/ActiveVPN
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Usage: usage.md
  - CLI Reference: cli.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Development: development.md
  - Deployment: deployment.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Screenshots: screenshots.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.critic
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rkriad585
